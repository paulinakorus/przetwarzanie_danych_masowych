# Docker DNS zwraca adresy wszystkich replik usługi "content",
# a nginx rozkłada ruch między nie (round-robin).
upstream content_backend {
    server content:80;
}

server {
    listen 80;

    location / {
        proxy_pass http://content_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
