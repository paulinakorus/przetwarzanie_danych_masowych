# Wbudowany DNS Dockera; nginx odpytuje go co 5 s i rozkłada ruch
# między wszystkie zwrócone adresy replik.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    location / {
        set $backend http://content:80;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}